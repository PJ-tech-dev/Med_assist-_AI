version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: medassist_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medassist_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      chromadb:
        condition: service_started
    restart: unless-stopped

volumes:
  chroma_data:
